# Built by scripts/build.mjs, which pins `version` to the root package.json so
# the app always matches the npm package it ships with.
appId: dev.opencockpit.desktop
productName: OpenCockpit
copyright: Copyright © Robert

directories:
  output: dist

files:
  - package.json
  - src/**
  - "!src/**/*.test.mjs"
  # The app has no runtime dependencies. Without this, electron-builder walks up
  # to the repo root's lock file and packs the whole server's node_modules.
  - "!**/node_modules/**"
npmRebuild: false

# Names here are a contract: bin/cock-app.mjs#assetFor downloads exactly these.
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

# No code signing (see bin/cock-app.mjs for how distribution works without it).
# macOS still gets an ad-hoc signature in scripts/afterPack.cjs: Apple Silicon
# will not run arm64 code without one, and renaming Electron's bundle breaks
# the signature it came with.
afterPack: scripts/afterPack.cjs
publish: null

mac:
  target: [zip, dmg]
  category: public.app-category.developer-tools
  icon: src/launcher/icon.png
  identity: null
  hardenedRuntime: false

# Zip only, no NSIS installer: an installer keeps its uninstaller and registry
# entry inside the install directory, which the self-update swaps wholesale.
# `cockpit app install` does the Windows integration (Start-menu shortcut).
win:
  target: [zip]
  icon: src/launcher/icon.png
